<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover permite usar toda la pantalla del iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Combi</title>

  <!-- Para que se pueda instalar -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#6d3622">

  <!-- Ajustes específicos de iPhone (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="La Combi">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado fijo: título, botones, día y buscador -->
  <header class="encabezado">
    <h1><img src="logo.png" alt="Logo de La Combi" class="logo">La Combi</h1>
    <div class="botones-encabezado">
      <button id="btnCopiar" class="boton-encabezado">Copiar</button>
      <button id="btnConteo" class="boton-encabezado">Conteo</button>
    </div>

    <div class="fila-fecha">
      <input id="campoFecha" type="date" aria-label="Día del registro">
      <button id="btnHoy" class="boton-hoy">Hoy</button>
    </div>
    <input id="buscador" type="search" placeholder="Buscar producto…" autocomplete="off">
  </header>

  <!-- Lista de productos del día (se llena desde app.js) -->
  <main>
    <p id="contador" class="contador"></p>
    <ul id="lista" class="lista"></ul>
    <p id="vacio" class="vacio" hidden>No se encontraron productos.</p>

    <section class="respaldo">
      <h2>Respaldo de datos</h2>
      <p>Guarda una copia de tus productos, días y conteos para no perderlos si el teléfono se daña o se borra el navegador.</p>
      <button id="btnExportar" class="boton secundario">Guardar respaldo</button>
      <button id="btnImportar" class="boton secundario">Restaurar respaldo</button>
      <input id="archivoRespaldo" type="file" accept="application/json,.json" hidden>
    </section>
  </main>

  <!-- Barra fija con los totales del día -->
  <div class="barra-totales">
    <div class="total"><span class="total-titulo">Piezas</span><span id="totPiezas" class="total-valor">0</span></div>
    <div class="total"><span class="total-titulo">Costo</span><span id="totCosto" class="total-valor">$0.00</span></div>
    <div class="total"><span class="total-titulo">Venta</span><span id="totVenta" class="total-valor">$0.00</span></div>
    <div class="total"><span class="total-titulo">Ganancia</span><span id="totGanancia" class="total-valor">$0.00</span></div>
  </div>

  <!-- Botón flotante para agregar un producto -->
  <button id="btnAgregar" class="flotante" aria-label="Agregar producto">+</button>

  <!-- Aviso breve (por ejemplo, "Pedido copiado") -->
  <div id="aviso" class="aviso" role="status" hidden></div>

  <!-- Pantalla del formulario (agregar / editar producto) -->
  <div id="hoja" class="hoja" hidden>
    <form id="formulario" class="formulario" novalidate>
      <h2 id="tituloFormulario">Nuevo producto</h2>

      <label for="campoNombre">Nombre</label>
      <input id="campoNombre" type="text" autocomplete="off" required>

      <label for="campoCompra">Precio de compra ($)</label>
      <input id="campoCompra" type="number" inputmode="decimal" min="0" step="0.01" value="0">

      <label for="campoVenta">Precio de venta ($)</label>
      <input id="campoVenta" type="number" inputmode="decimal" min="0" step="0.01" value="0">

      <p id="mensajeError" class="error" role="alert" hidden></p>

      <div class="acciones">
        <button type="submit" class="boton principal">Guardar</button>
        <button type="button" id="btnCancelar" class="boton secundario">Cancelar</button>
        <button type="button" id="btnEliminar" class="boton peligro" hidden>Eliminar producto</button>
      </div>
    </form>
  </div>

  <!-- Pantalla del conteo físico -->
  <div id="hojaConteo" class="hoja" hidden>
    <div class="conteo">
      <h2>Conteo físico</h2>
      <p id="ayudaConteo" class="ayuda"></p>
      <div id="resultadoConteo" class="resultado" hidden></div>
      <ul id="listaConteo" class="lista-conteo"></ul>

      <div class="barra-conteo">
        <p id="conteoMensaje" class="mensaje" role="status" hidden></p>
        <p id="conteoError" class="error" role="alert" hidden></p>
        <div class="acciones">
          <button type="button" id="btnGuardarConteo" class="boton principal">Guardar conteo</button>
          <button type="button" id="btnCerrarConteo" class="boton secundario">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="datos.js"></script>
  <script src="app.js"></script>
</body>
</html>
